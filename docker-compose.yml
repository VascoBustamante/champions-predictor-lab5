services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: championsdb
      POSTGRES_USER: ${DB_USER:-champions}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-champions123}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5435:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-champions} -d championsdb"]
      interval: 5s
      timeout: 3s
      retries: 12
  mock-api:
    image: nginx:alpine
    volumes:
      - ./src/main/resources/mock-api:/usr/share/nginx/html:ro
    ports:
      - "127.0.0.1:8091:80"
  app:
    build: .
    image: ${APP_IMAGE:-champions-predictor:local}
    environment:
      DB_URL: jdbc:postgresql://db:5432/championsdb
      DB_USER: ${DB_USER:-champions}
      DB_PASSWORD: ${DB_PASSWORD:-champions123}
      MATCHES_API_URL: http://mock-api/partidos.json
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
      mock-api:
        condition: service_started
    restart: unless-stopped
volumes:
  postgres_data:
