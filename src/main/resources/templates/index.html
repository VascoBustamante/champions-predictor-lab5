<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Champions Predictor</title><link rel="stylesheet" th:href="@{/css/style.css}"></head><body><main><nav><a href="/">Partidos</a><a href="/predicciones">Ver predicciones</a></nav><h1>⚽ Champions Predictor</h1><p>Partidos de demostración cargados desde una API simulada y guardados en PostgreSQL.</p><p class="ok" th:if="${mensaje}" th:text="${mensaje}"></p><p class="error" th:if="${error}" th:text="${error}"></p><section class="grid"><article th:each="p : ${partidos}"><span class="tag" th:text="${p.etapa}"></span><h2><span th:text="${p.local}"></span> <small>vs.</small> <span th:text="${p.visitante}"></span></h2><p th:text="${#temporals.format(p.fecha,'dd/MM/yyyy HH:mm')}"></p><form method="post" action="/predicciones"><input type="hidden" name="partidoId" th:value="${p.id}"><label>Resultado predicho<select name="resultado" required><option value="LOCAL">Gana local</option><option value="EMPATE">Empate</option><option value="VISITANTE">Gana visitante</option></select></label><div class="scores"><label>Goles local<input type="number" min="0" max="99" name="golesLocal" value="1" required></label><label>Goles visitante<input type="number" min="0" max="99" name="golesVisitante" value="0" required></label></div><button type="submit">Guardar predicción</button></form></article></section></main></body></html>
