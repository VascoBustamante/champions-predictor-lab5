<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Predicciones registradas</title><link rel="stylesheet" th:href="@{/css/style.css}"></head><body><main><nav><a href="/">Partidos</a><a href="/predicciones">Ver predicciones</a></nav><h1>Predicciones registradas</h1><p>Consulta de registros guardados en PostgreSQL.</p><div class="tablewrap"><table><thead><tr><th>ID</th><th>Partido</th><th>Resultado</th><th>Marcador</th><th>Registrado</th></tr></thead><tbody><tr th:each="p : ${predicciones}"><td th:text="${p.id}"></td><td th:text="${p.partido.local + ' vs. ' + p.partido.visitante}"></td><td th:text="${p.resultado}"></td><td th:text="${p.golesLocal + ' - ' + p.golesVisitante}"></td><td th:text="${#temporals.format(p.creadoEn,'dd/MM/yyyy HH:mm')}"></td></tr><tr th:if="${#lists.isEmpty(predicciones)}"><td colspan="5">Todavía no hay predicciones</td></tr></tbody></table></div></main></body></html>
